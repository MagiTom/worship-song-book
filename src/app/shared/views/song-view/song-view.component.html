@if(song(); as song){
    <div class="song">
        <h1 class="song__title">{{song.title}}</h1>
        <div class="song__text" [ngStyle]="{'columns': columnsCount()}">
            @for (item of songArr(); track $index) {
                @if(checkIfChords(item)){
                    <pre class="chord">{{removeSquereBrackets(item)}}</pre>
                } @else {
                    <pre>{{item}}</pre>
                }
    
            @if (item === '') {
                <br />
            }
        }
        </div>
    </div>
}
